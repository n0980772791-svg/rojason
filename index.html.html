<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>熱量管理</title>
<style>
:root{
  --bg:#f5f5f2; --card:#ffffff; --text:#1d1d1b; --sub:#6b6b66; --line:#dcdcd5;
  --ok:#1f7a45; --bad:#c2410c; --btn:#1d1d1b; --btntext:#fff;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark; --bg:#161615; --card:#1f1f1d; --text:#ececE8; --sub:#9a9a93; --line:#34342f;
    --ok:#4ade80; --bad:#fb923c; --btn:#ececE8; --btntext:#161615; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:600}
.datebar{display:flex;gap:8px;align-items:center}
.datebar input{flex:1}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:9px 14px;cursor:pointer}
button.primary{background:var(--btn);color:var(--btntext);border-color:var(--btn)}
button:focus-visible,input:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.status{font-size:32px;font-weight:700;margin:2px 0 4px}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.big{font-size:15px;color:var(--sub)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cell{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.cell b{display:block;font-size:20px}
.cell span{font-size:13px;color:var(--sub)}
.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meals label{font-size:13px;color:var(--sub);display:block;margin-bottom:4px}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1.4} .row button{flex:1}
.undo{margin-top:8px;font-size:14px;color:var(--sub);background:none;border:none;padding:4px 0;text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600}
tr.sel td{font-weight:700}
.tag-ok{color:var(--ok)} .tag-bad{color:var(--bad)}
tbody tr{cursor:pointer}
.foot{font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<main>

<section>
  <h2>日期</h2>
  <div class="datebar">
    <button id="prev" aria-label="前一天">‹</button>
    <input type="date" id="date">
    <button id="next" aria-label="後一天">›</button>
  </div>
</section>

<section>
  <div id="status" class="status"></div>
  <div id="statusSub" class="big"></div>
  <div class="grid">
    <div class="cell"><span>今日目標（三餐合計）</span><b id="goal"></b></div>
    <div class="cell"><span>昨日累積未消除</span><b id="carry"></b></div>
    <div class="cell"><span>今日多吃</span><b id="extra"></b></div>
    <div class="cell"><span>今日已消耗</span><b id="burn"></b></div>
  </div>
</section>

<section>
  <h2>增減熱量</h2>
  <input type="number" id="num" inputmode="numeric" min="1" placeholder="輸入卡路里，例如 100">
  <div class="row">
    <button class="primary" id="addEat">多吃 ＋</button>
    <button class="primary" id="addBurn">消耗 －</button>
  </div>
  <button class="undo" id="undo">復原上一筆</button>
</section>

<section>
  <h2>三餐目標熱量</h2>
  <div class="meals">
    <div><label for="m1">早餐</label><input type="number" id="m1" inputmode="numeric" min="0"></div>
    <div><label for="m2">午餐</label><input type="number" id="m2" inputmode="numeric" min="0"></div>
    <div><label for="m3">晚餐</label><input type="number" id="m3" inputmode="numeric" min="0"></div>
  </div>
</section>

<section>
  <h2>紀錄</h2>
  <table>
    <thead><tr><th>日期</th><th>多吃</th><th>消耗</th><th>待消耗</th><th>狀態</th></tr></thead>
    <tbody id="hist"></tbody>
  </table>
  <p class="foot">待消耗 ＝ 前一天累積 ＋ 多吃 − 消耗。小於等於 0 即當天完成；未完成的數字會累積到隔天。</p>
</section>

</main>

<script>
const KEY = 'calorie-manager-v1';
let state = { meals:[700,700,700], days:{} }; // days[date] = { log:[{t:'e'|'b', n:數字}] }

try { const s = localStorage.getItem(KEY); if (s) state = Object.assign(state, JSON.parse(s)); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const today = fmt(new Date());
let current = today;

function dayTotals(date){
  const d = state.days[date];
  let e=0,b=0;
  if (d) for (const x of d.log) x.t==='e' ? e+=x.n : b+=x.n;
  return {e,b};
}

// 從第一筆紀錄日算到 upTo，逐日累積
function compute(upTo){
  const keys = Object.keys(state.days).sort();
  const rows = [];
  if (!keys.length) return rows;
  let start = parse(keys[0]);
  const end = parse(upTo > today ? upTo : (keys[keys.length-1] > upTo ? keys[keys.length-1] : upTo));
  let carry = 0;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const ds = fmt(d);
    const {e,b} = dayTotals(ds);
    const bal = carry + e - b;
    rows.push({date:ds, carry, e, b, bal, done: bal <= 0});
    carry = Math.max(0, bal);
  }
  return rows;
}

function rowFor(date){
  const rows = compute(date);
  const r = rows.find(x => x.date === date);
  if (r) return r;
  // 尚無紀錄的日期：承接最後一天的累積
  const last = rows[rows.length-1];
  const carry = last ? Math.max(0, last.bal) : 0;
  return {date, carry, e:0, b:0, bal:carry, done: carry<=0};
}

function render(){
  const goal = state.meals.reduce((a,b)=>a+b,0);
  const r = rowFor(current);
  $('date').value = current;
  $('goal').textContent = goal;
  $('carry').textContent = r.carry;
  $('extra').textContent = r.e;
  $('burn').textContent = r.b;
  const st = $('status');
  if (r.done){
    st.textContent = '今日完成 ✓';
    st.className = 'status ok';
    $('statusSub').textContent = r.bal < 0 ? `多消耗 ${-r.bal} 卡` : '已達標';
  } else {
    st.textContent = `還差 ${r.bal} 卡`;
    st.className = 'status bad';
    $('statusSub').textContent = '消耗完才算完成，沒做完會累積到隔天';
  }
  ['m1','m2','m3'].forEach((id,i)=>{ if (document.activeElement.id!==id) $(id).value = state.meals[i]; });

  const rows = compute(today > current ? today : current).slice().reverse();
  $('hist').innerHTML = rows.map(x =>
    `<tr data-d="${x.date}" class="${x.date===current?'sel':''}">
      <td>${x.date.slice(5)}</td><td>${x.e}</td><td>${x.b}</td>
      <td>${Math.max(0,x.bal)}</td>
      <td class="${x.done?'tag-ok':'tag-bad'}">${x.done?'完成':'未完成'}</td></tr>`).join('')
    || '<tr><td colspan="5" style="text-align:center;color:var(--sub)">尚無紀錄</td></tr>';
}

function add(type){
  const n = Math.round(Number($('num').value));
  if (!(n > 0)) { $('num').focus(); return; }
  (state.days[current] ||= {log:[]}).log.push({t:type, n});
  $('num').value = '';
  save(); render();
}

$('addEat').onclick = () => add('e');
$('addBurn').onclick = () => add('b');
$('num').addEventListener('keydown', e => { if (e.key==='Enter') add('e'); });
$('undo').onclick = () => {
  const d = state.days[current];
  if (d && d.log.length){ d.log.pop(); if(!d.log.length) delete state.days[current]; save(); render(); }
};
$('date').onchange = e => { if (e.target.value){ current = e.target.value; render(); } };
const shift = k => { const d = parse(current); d.setDate(d.getDate()+k); current = fmt(d); render(); };
$('prev').onclick = () => shift(-1);
$('next').onclick = () => shift(1);
['m1','m2','m3'].forEach((id,i)=> $(id).addEventListener('input', e => {
  state.meals[i] = Math.max(0, Math.round(Number(e.target.value)) || 0); save(); render();
}));
$('hist').onclick = e => { const tr = e.target.closest('tr[data-d]'); if (tr){ current = tr.dataset.d; render(); } };

render();
</script>
</body>
</html>
